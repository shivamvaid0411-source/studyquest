<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyQuest — Turn Your Syllabus Into an Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F19;
  --bg2:#111827;
  --card:#161F36;
  --card-hover:#1D2748;
  --border: rgba(255,255,255,0.12);
  --purple:#7C3AED;
  --purple-glow:#9061F9;
  --purple-shadow:#4C1D95;
  --emerald:#10B981;
  --emerald-shadow:#065F46;
  --amber:#F59E0B;
  --amber-shadow:#92400E;
  --cyan:#38BDF8;
  --cyan-shadow:#0E5A78;
  --crimson:#EF4444;
  --crimson-shadow:#7F1D1D;
  --text:#F3F4F6;
  --text-dim:#9CA3AF;
  --text-faint:#6B7280;
}
*{box-sizing:border-box; margin:0; padding:0;}
button{color:inherit;}
body{
  background:radial-gradient(ellipse at top, #131B31 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  line-height:1.5;
}
h1,h2,h3,h4{ font-family:'Outfit',sans-serif; }
img{max-width:100%;display:block;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}

/* ---------- NAV ---------- */
.nav{
  position:sticky; top:0; z-index:50;
  background:rgba(11,15,25,0.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1180px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;cursor:pointer;}
.brand-badge{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:17px;}
.nav-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pill{
  display:flex;align-items:center;gap:6px;
  background:var(--card); border:1.5px solid var(--border); border-radius:999px;
  padding:6px 13px; font-size:14px; font-weight:600; white-space:nowrap;
}
.pill.xp{color:var(--amber);}
.pill.streak{color:#FB923C;}
.mode-toggle{
  display:flex; background:var(--card); border:1.5px solid var(--border); border-radius:999px; padding:3px; gap:2px;
}
.mode-toggle button{
  border:none; background:transparent; color:var(--text-dim); font-weight:700; font-size:13px;
  padding:8px 16px; border-radius:999px; transition:.15s;
}
.mode-toggle button.active.adventure{background:var(--purple); color:#fff;}
.mode-toggle button.active.focused{background:var(--cyan); color:#03222F;}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:14px; border:2px solid transparent; font-weight:700; font-size:15px;
  padding:13px 24px; transition:transform .08s ease, box-shadow .08s ease;
}
.btn-purple{ background:var(--purple); border-color:var(--purple-glow); color:#fff; box-shadow:0 6px 0 var(--purple-shadow);}
.btn-purple:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--purple-shadow); }
.btn-cyan{ background:var(--cyan); border-color:#7DD3FC; color:#04202B; box-shadow:0 6px 0 var(--cyan-shadow);}
.btn-cyan:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--cyan-shadow); }
.btn-outline{ background:transparent; border-color:var(--border); color:var(--text); box-shadow:0 6px 0 rgba(255,255,255,0.06);}
.btn-outline:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(255,255,255,0.06);}
.btn-emerald{ background:var(--emerald); border-color:#34D399; color:#052e22; box-shadow:0 6px 0 var(--emerald-shadow);}
.btn-emerald:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--emerald-shadow);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-sm{padding:9px 16px; font-size:13px; border-radius:11px;}

/* ---------- HERO ---------- */
.hero{ padding:64px 0 44px; }
.hero-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:center;}
.eyebrow{color:var(--purple-glow); font-weight:700; font-size:14px; letter-spacing:.02em; margin-bottom:14px;}
.hero h1{ font-size:48px; line-height:1.08; font-weight:800; margin-bottom:18px;}
.hero h1 .grad{ background:linear-gradient(135deg,#A78BFA,#38BDF8); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{ color:var(--text-dim); font-size:17px; max-width:520px; margin-bottom:28px;}
.hero-actions{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px;}
.social-row{display:flex; align-items:center; gap:12px; color:var(--text-dim); font-size:14px;}
.avatars{display:flex;}
.avatars span{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));border:2px solid var(--bg);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.avatars span:first-child{margin-left:0;}

.hero-art{
  background:var(--card); border:2px solid var(--border); border-radius:26px;
  padding:26px; box-shadow:0 8px 0 rgba(0,0,0,.35);
  position:relative; overflow:hidden;
}
.hero-art .screen{
  background:linear-gradient(160deg,#0E1A33,#101534); border-radius:16px; padding:22px;
  border:1px solid var(--border);
}
.hero-art .screen .lvl{color:var(--cyan); font-weight:800; font-size:13px; letter-spacing:.03em; margin-bottom:8px;}
.bar-track{height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:10px;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--purple),var(--cyan)); border-radius:99px;}
.hero-art .caption{margin-top:16px; color:var(--text-faint); font-size:13px;}
.floaty-badge{
  position:absolute; background:var(--card); border:2px solid var(--border); border-radius:14px;
  padding:9px 13px; font-size:12px; font-weight:700; box-shadow:0 5px 0 rgba(0,0,0,.3);
}
.fb1{top:14px; right:-10px; color:var(--amber);}
.fb2{bottom:18px; left:-12px; color:var(--emerald);}

/* ---------- FEATURES ---------- */
.features{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:32px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin:16px 0 44px;}
.feature{display:flex; gap:12px; align-items:flex-start;}
.feature .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.feature h4{font-size:15px; margin-bottom:3px;}
.feature p{font-size:13px; color:var(--text-dim);}

/* ---------- MODE OPTION CARDS ---------- */
.section-title{text-align:center; margin-bottom:34px;}
.section-title h2{font-size:30px; margin-bottom:8px;}
.section-title p{color:var(--text-dim); font-size:15px;}
.options{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:56px;}
.option-card{ border-radius:24px; padding:30px; border:2px solid var(--border); position:relative; overflow:hidden;}
.option-card.opt1{background:linear-gradient(160deg,#241540,#161F36);}
.option-card.opt2{background:linear-gradient(160deg,#0E2C3B,#161F36);}
.badge-tag{display:inline-block; font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; margin-bottom:14px;}
.opt1 .badge-tag{background:rgba(124,58,237,.25); color:#C4B5FD;}
.opt2 .badge-tag{background:rgba(56,189,248,.25); color:#7DD3FC;}
.option-card h3{font-size:24px; margin-bottom:10px;}
.option-card p{color:var(--text-dim); font-size:14px; margin-bottom:22px; max-width:380px;}

/* ---------- SUBJECT GRID ---------- */
.subjects-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding-bottom:70px;}
.subject-card{
  background:var(--card); border:2px solid var(--border); border-radius:20px; padding:22px;
  transition:.15s; cursor:pointer; text-align:left; color:var(--text);
}
.subject-card:hover{ background:var(--card-hover); transform:translateY(-3px); border-color:rgba(255,255,255,.22);}
.subject-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:14px;}
.subject-card h3{font-size:17px; margin-bottom:4px; color:var(--text);}
.subject-card .code{color:var(--text-faint); font-size:12px; margin-bottom:12px;}
.subject-meta{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.meta-chip{font-size:11px; color:var(--text-dim); background:rgba(255,255,255,.06); padding:3px 9px; border-radius:999px;}
.progress-row{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:6px;}

/* ---------- TOPBAR (breadcrumb) ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:26px 0 8px; gap:14px; flex-wrap:wrap;}
.crumb-btn{display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:9px 15px; font-weight:600; font-size:14px; color:var(--text);}
.crumb-btn:hover{background:var(--card-hover);}
.page-title{font-size:26px; font-weight:800;}
.page-sub{color:var(--text-dim); font-size:14px; margin-top:2px;}

/* ---------- ADVENTURE: ARC ISLANDS ---------- */
.island-belt{ display:flex; gap:0; align-items:center; overflow-x:auto; padding:44px 6px 60px; }
.island-node{ display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:168px; text-align:center;}
.island-connector{width:52px; height:2px; background:repeating-linear-gradient(90deg,var(--border) 0 8px, transparent 8px 16px); flex-shrink:0; margin-top:-52px;}
.island-circle{
  width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:36px; border:3px solid; margin-bottom:14px; position:relative; transition:.15s;
}
.island-circle.unlocked{ background:radial-gradient(circle at 35% 30%, #8B5CF6, #5B21B6); border-color:var(--purple-glow); box-shadow:0 8px 0 var(--purple-shadow), 0 0 30px rgba(124,58,237,.35); cursor:pointer;}
.island-circle.unlocked:hover{transform:translateY(-4px);}
.island-circle.complete{ background:radial-gradient(circle at 35% 30%, #34D399, #047857); border-color:#34D399; box-shadow:0 8px 0 var(--emerald-shadow); cursor:pointer;}
.island-circle.locked{ background:#1B2136; border-color:var(--border); box-shadow:0 8px 0 #0D111E; color:var(--text-faint); cursor:not-allowed;}
.island-node h4{font-size:14px; margin-bottom:3px;}
.island-node span{font-size:12px; color:var(--text-faint);}
.island-node .arc-progress{font-size:11px; color:var(--emerald); font-weight:700; margin-top:4px;}

/* ---------- ADVENTURE: LEVEL TRAIL ---------- */
.trail-panel{ background:var(--card); border:2px solid var(--border); border-radius:24px; padding:34px 30px 44px; margin-bottom:60px;}
.trail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;flex-wrap:wrap;gap:12px;}
.trail-head h3{font-size:19px;}
.trail-head .sub{color:var(--text-dim); font-size:13px;}
.trail{display:flex; flex-direction:column; align-items:center; gap:0; position:relative;}
.trail-item{display:flex; align-items:center; gap:22px; width:100%; max-width:460px; position:relative; padding:14px 0;}
.trail-item:nth-child(even){flex-direction:row-reverse;}
.trail-line{position:absolute; left:50%; top:-14px; width:2px; height:28px; background:repeating-linear-gradient(0deg,var(--border) 0 7px, transparent 7px 14px); transform:translateX(-50%);}
.trail-item:first-child .trail-line{display:none;}
.node-circle{
  width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:800; border:3px solid; flex-shrink:0; position:relative; z-index:2;
}
.node-circle.done{background:var(--emerald); border-color:#34D399; box-shadow:0 5px 0 var(--emerald-shadow); color:#04301f;}
.node-circle.current{background:var(--purple); border-color:var(--purple-glow); box-shadow:0 5px 0 var(--purple-shadow), 0 0 0 8px rgba(124,58,237,.15); color:#fff; cursor:pointer;}
.node-circle.locked{background:#1B2136; border-color:var(--border); color:var(--text-faint); box-shadow:0 5px 0 #0D111E;}
.node-circle.boss{background:var(--crimson); border-color:#FCA5A5; box-shadow:0 5px 0 var(--crimson-shadow); color:#fff; cursor:pointer;}
.trail-label{background:var(--bg2); border:1.5px solid var(--border); border-radius:14px; padding:11px 16px; flex:1;}
.trail-label h5{font-size:14px; margin-bottom:2px;}
.trail-label span{font-size:12px; color:var(--text-faint);}
.trail-item.clickable .trail-label{cursor:pointer;}
.trail-item.clickable .trail-label:hover{border-color:var(--purple-glow);}

/* ---------- FOCUSED: UNIT BANNERS ---------- */
.unit-list{display:flex; flex-direction:column; gap:14px; margin-bottom:56px;}
.unit-banner{
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  background:var(--card); border:2px solid var(--border); border-radius:20px; padding:22px 26px; cursor:pointer; transition:.15s;
  color:var(--text); width:100%; text-align:left;
}
.unit-banner:hover{background:var(--card-hover); border-color:rgba(255,255,255,.22);}
.unit-left{display:flex; align-items:center; gap:18px;}
.unit-num{width:48px;height:48px;border-radius:14px;background:rgba(124,58,237,.18); color:#C4B5FD; display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;}
.unit-banner h3{font-size:17px; margin-bottom:3px; color:var(--text);}
.unit-banner .u-sub{font-size:13px; color:var(--text-dim);}
.unit-right{display:flex; align-items:center; gap:14px; flex-shrink:0;}
.lect-chip{font-size:12px; color:var(--text-faint); background:rgba(255,255,255,.05); padding:5px 12px; border-radius:999px; white-space:nowrap;}

/* ---------- FOCUSED: BUBBLES ---------- */
.bubble-grid{display:flex; flex-wrap:wrap; gap:14px; padding-bottom:60px;}
.bubble{
  background:var(--card); border:2px solid var(--border); border-radius:999px; padding:14px 22px;
  display:flex; align-items:center; gap:10px; cursor:pointer; transition:.15s; font-weight:600; font-size:14px;
}
.bubble:hover{ transform:translateY(-3px); border-color:var(--purple-glow); background:var(--card-hover);}
.bubble .tag{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700;}
.tag.high{background:rgba(239,68,68,.18); color:#FCA5A5;}
.tag.quick{background:rgba(245,158,11,.18); color:#FCD34D;}

/* ---------- MODAL / DRAWER ---------- */
.overlay{ position:fixed; inset:0; background:rgba(6,8,14,.72); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.drawer{
  width:100%; max-width:760px; max-height:88vh; overflow-y:auto;
  background:var(--bg2); border:2px solid var(--border); border-bottom:none;
  border-radius:26px 26px 0 0; padding:34px 34px 44px; box-shadow:0 -10px 40px rgba(0,0,0,.5);
  animation:slideUp .25s ease;
}
@keyframes slideUp{ from{transform:translateY(60px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.drawer-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:6px;}
.drawer-head h2{font-size:23px; max-width:560px;}
.close-x{background:var(--card); border:1.5px solid var(--border); width:36px;height:36px;border-radius:50%; font-size:16px; color:var(--text-dim); flex-shrink:0;}
.drawer-meta{display:flex; gap:10px; margin:12px 0 22px; flex-wrap:wrap;}
.panel{margin-bottom:22px; background:var(--card); border:1.5px solid var(--border); border-radius:16px; padding:18px 20px;}
.panel h4{display:flex; align-items:center; gap:8px; font-size:13px; text-transform:none; color:var(--purple-glow); margin-bottom:10px; font-weight:700;}
.panel.trap h4{color:var(--crimson);}
.panel.res h4{color:var(--cyan);}
.panel p{font-size:14.5px; color:#E5E7EB; line-height:1.6;}
.tech-content{ font-size:14.5px; color:#E5E7EB; line-height:1.75; }
.tech-content p{ margin-bottom:12px; }
.tech-content p:last-child{ margin-bottom:0; }
.tech-content .formula-line{
  display:block; background:#0B0F19; border:1px solid var(--border); border-left:3px solid var(--cyan);
  border-radius:8px; padding:10px 13px; margin:8px 0; font-family:'Inter',sans-serif; font-size:13.5px;
  color:#7DD3FC; font-weight:600; letter-spacing:.01em;
}
.res-links{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.res-link{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; font-size:13.5px; text-decoration:none;}
.res-link:hover{border-color:var(--cyan);}
.res-link .rtype{font-size:11px; color:var(--text-faint);}
.drawer-actions{display:flex; gap:12px; margin-top:8px;}

/* ---------- FOOTER ---------- */
.footer{border-top:1px solid var(--border); padding:34px 0 90px; text-align:center; color:var(--text-faint); font-size:13px;}

.watermark{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  z-index:999; display:flex; align-items:center; gap:7px;
  background:rgba(22,31,54,0.92); backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,0.16); border-radius:999px;
  padding:9px 18px; font-size:12.5px; font-weight:700; color:var(--text-dim);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
  pointer-events:none; white-space:nowrap;
}
.watermark span.star{color:var(--amber);}
@media(max-width:560px){
  .watermark{ font-size:11px; padding:7px 14px; bottom:12px; }
}

@media(max-width:860px){
  .hero-grid{grid-template-columns:1fr;}
  .features{grid-template-columns:1fr 1fr;}
  .options{grid-template-columns:1fr;}
  .subjects-grid{grid-template-columns:1fr 1fr;}
  .hero h1{font-size:36px;}
  .trail-item, .trail-item:nth-child(even){flex-direction:row;}
  .wrap{padding:0 18px;}
}
@media(max-width:560px){
  .subjects-grid{grid-template-columns:1fr;}
  .features{grid-template-columns:1fr;}
  .nav-inner{flex-wrap:wrap; padding:12px 16px; gap:10px;}
  .brand{font-size:17px;}
  .brand-badge{width:30px;height:30px;font-size:15px;}
  .nav-stats{width:100%; justify-content:space-between;}
  .pill{font-size:12.5px; padding:5px 10px;}
  .mode-toggle button{padding:7px 12px; font-size:12px;}

  .hero{padding:32px 0 28px;}
  .hero h1{font-size:28px;}
  .hero p{font-size:15px;}
  .hero-actions{flex-direction:column; align-items:stretch;}
  .hero-actions .btn{width:100%;}
  .hero-art{padding:18px; border-radius:20px;}
  .floaty-badge{font-size:11px; padding:7px 10px;}
  .fb1{right:6px;}
  .fb2{left:6px;}

  .section-title h2{font-size:22px;}
  .option-card{padding:22px;}
  .option-card h3{font-size:20px;}

  .subject-card{padding:18px;}

  .topbar{padding:18px 0 4px;}
  .page-title{font-size:20px;}

  .island-belt{padding:28px 4px 40px; gap:0;}
  .island-node{width:120px;}
  .island-circle{width:76px; height:76px; font-size:26px; margin-bottom:10px;}
  .island-connector{width:26px; margin-top:-38px;}
  .island-node h4{font-size:13px;}
  .island-node span{font-size:11px;}

  .trail-panel{padding:22px 16px 30px; border-radius:18px;}
  .trail-item{gap:14px; max-width:100%;}
  .node-circle{width:50px; height:50px; font-size:17px;}
  .trail-label{padding:10px 12px;}
  .trail-label h5{font-size:13px;}

  .unit-banner{padding:16px; flex-wrap:wrap; gap:12px;}
  .unit-num{width:40px; height:40px; font-size:15px;}
  .unit-banner h3{font-size:15px;}

  .bubble{padding:11px 16px; font-size:13px;}

  .drawer{max-height:92vh; padding:24px 18px 30px; border-radius:20px 20px 0 0;}
  .drawer-head h2{font-size:19px;}
  .panel{padding:14px 15px;}
  .drawer-actions{flex-direction:column;}
  .drawer-actions .btn{width:100%;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="brand" onclick="goHome()"><div class="brand-badge">🎮</div>StudyQuest</div>
    <div class="nav-stats">
      <span class="pill xp">⭐ <span id="xpDisplay">0</span> XP</span>
      <span class="pill streak">🔥 <span id="streakDisplay">0</span> day streak</span>
      <div class="mode-toggle">
        <button id="tglAdv" class="adventure" onclick="setMode('adventure')">Adventure</button>
        <button id="tglFoc" class="focused" onclick="setMode('focused')">Focused</button>
      </div>
    </div>
  </div>
</nav>

<div id="app"></div>

<div class="footer">StudyQuest made by Shivam to gamify studying because he was bored.</div>

<div class="watermark"><span class="star">✦</span> Built by Shivam</div>

<script>
/* ========================= CURRICULUM DATA ========================= */
const SUBJECTS = [
{

/* ========================= STATE ========================= */
const state = {
  mode: 'adventure',      // 'adventure' | 'focused'
  view: 'home',           // home | subjects | arcs | trail | units | bubbles
  subjectIdx: null,
  arcIdx: null,
  unitIdx: null,
  xp: 0,
  streak: 0,
  completed: new Set()  // subjectIdx-unitIdx-topicIdx
};

function tkey(s,u,t){ return s+'-'+u+'-'+t; }

function isTopicUnlocked(s,u,t){
  // All levels are unlocked from the start — a student can jump straight to
  // whichever topic they're weak on instead of being blocked by earlier ones.
  return true;
}
function isUnitUnlocked(s,u){
  // All arcs/units are unlocked from the start, same reasoning as above.
  return true;
}
function unitProgress(s,u){
  const unit = SUBJECTS[s].units[u];
  let done=0; unit.topics.forEach((t,i)=>{ if(state.completed.has(tkey(s,u,i))) done++; });
  return {done, total:unit.topics.length};
}
function subjectProgress(s){
  let done=0, total=0;
  SUBJECTS[s].units.forEach((unit,u)=>{ unit.topics.forEach((t,i)=>{ total++; if(state.completed.has(tkey(s,u,i))) done++; }); });
  return {done,total};
}

/* ========================= NAV HELPERS ========================= */
function setMode(m){ state.mode=m; state.view = state.view==='home' ? 'home' : 'subjects'; render(); }
function goHome(){ state.view='home'; render(); }
function openSubjects(m){ state.mode=m; state.view='subjects'; render(); }
function openSubject(i){
  state.subjectIdx=i;
  state.view = state.mode==='adventure' ? 'arcs' : 'units';
  render();
}
function openArc(i){ if(!isUnitUnlocked(state.subjectIdx,i)) return; state.arcIdx=i; state.view='trail'; render(); }
function openUnit(i){ state.unitIdx=i; state.view='bubbles'; render(); }
function backTo(view){ state.view=view; render(); }

let activeTopicRef = null;
function openTopic(s,u,t,locked){
  if(locked) return;
  activeTopicRef = {s,u,t};
  renderDrawer();
}
function closeDrawer(){
  const ov = document.getElementById('drawerOverlay');
  if(ov) ov.remove();
}
function completeTopic(){
  const {s,u,t} = activeTopicRef;
  const key = tkey(s,u,t);
  if(!state.completed.has(key)){
    state.completed.add(key);
    const topic = SUBJECTS[s].units[u].topics[t];
    state.xp += topic.xp;
    state.streak += 0;
  }
  closeDrawer();
  render();
}

/* ========================= RENDER ========================= */
function updateHeader(){
  document.getElementById('xpDisplay').textContent = state.xp;
  document.getElementById('streakDisplay').textContent = state.streak;
  document.getElementById('tglAdv').classList.toggle('active', state.mode==='adventure');
  document.getElementById('tglFoc').classList.toggle('active', state.mode==='focused');
}

function render(){
  updateHeader();
  const app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='subjects') app.innerHTML = renderSubjects();
  else if(state.view==='arcs') app.innerHTML = renderArcs();
  else if(state.view==='trail') app.innerHTML = renderTrail();
  else if(state.view==='units') app.innerHTML = renderUnits();
  else if(state.view==='bubbles') app.innerHTML = renderBubbles();
  window.scrollTo({top:0, behavior:'instant'});
}

        <div class="page-title">${state.mode==='adventure' ? 'Choose a World to Begin Your Adventure' : 'Choose a Subject for Focused Learning'}</div>

      </div>
      <div></div>
    </div>
    ${renderSubjectGrid()}
  </div>`;
}

function renderArcs(){
  const s = SUBJECTS[state.subjectIdx];
  return `<div class="wrap">
    <div class="topbar">
      <button class="crumb-btn" onclick="backTo('subjects')">← Subjects</button>
      <div>
        <div class="page-title">${s.icon} ${s.name}</div>
        <div class="page-sub">${s.code} · Choose an arc (unit) to begin your journey!</div>
      </div>
      <div></div>
    </div>
    <div class="island-belt">
      ${s.units.map((unit,u)=>{
        const unlocked = isUnitUnlocked(state.subjectIdx,u);
        const prog = unitProgress(state.subjectIdx,u);
        const complete = prog.done===prog.total;
        const cls = complete ? 'complete' : (unlocked ? 'unlocked' : 'locked');
        const icon = complete ? '🏆' : (unlocked ? '🏝️' : '🔒');
        return `${u>0 ? '<div class="island-connector"></div>' : ''}
        <div class="island-node">
          <div class="island-circle ${cls}" onclick="openArc(${u})">${icon}</div>
          <h4>Arc ${u+1}</h4>
          <span>${unit.title}</span>
          <span class="arc-progress">${unlocked ? prog.done+'/'+prog.total+' levels' : 'Locked'}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderTrail(){
  const s = SUBJECTS[state.subjectIdx];
  const unit = s.units[state.arcIdx];
  const prog = unitProgress(state.subjectIdx, state.arcIdx);
  return `<div class="wrap">
    <div class="topbar">
      <button class="crumb-btn" onclick="backTo('arcs')">← ${s.name}</button>
      <div>
        <div class="page-title">Arc ${state.arcIdx+1}: ${unit.title}</div>
        <div class="page-sub">${unit.lectures} proposed lectures · ${prog.done}/${prog.total} levels complete</div>
      </div>
      <div></div>
    </div>
    <div class="trail-panel">
      <div class="trail-head">
        <h3>Level Trail</h3>
        <span class="sub">Clear each level in order to unlock the next</span>
      </div>
      <div class="trail">
        ${unit.topics.map((topic,t)=>{
          const key = tkey(state.subjectIdx, state.arcIdx, t);
          const done = state.completed.has(key);
          const unlocked = isTopicUnlocked(state.subjectIdx, state.arcIdx, t);
          const cls = done ? 'done' : (unlocked ? 'current' : 'locked');
          const icon = done ? '✓' : (unlocked ? '▶' : '🔒');
          const clickable = unlocked;
          return `<div class="trail-item ${clickable?'clickable':''}">
            <div class="trail-line"></div>
            <div class="node-circle ${cls}" ${clickable?`onclick="openTopic(${state.subjectIdx},${state.arcIdx},${t},false)"`:''}>${icon}</div>
            <div class="trail-label" ${clickable?`onclick="openTopic(${state.subjectIdx},${state.arcIdx},${t},false)"`:''}>
              <h5>Level ${t+1} · ${topic.title}</h5>
              <span>${done ? 'Completed · +'+topic.xp+' XP earned' : (unlocked ? '+'+topic.xp+' XP · Tap to start' : 'Locked')}</span>

          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function renderUnits(){
  const s = SUBJECTS[state.subjectIdx];
  return `<div class="wrap">
    <div class="topbar">
      <button class="crumb-btn" onclick="backTo('subjects')">← Subjects</button>

        <div class="page-title">${s.icon} ${s.name}</div>

    <div class="unit-list">

        return `<div class="unit-banner" onclick="openUnit(${u})">

              <h3>Unit ${['I','II','III','IV','V'][u]}: ${unit.title}</h3>

            <span style="color:var(--text-faint);">→</span>
          </div>

      }).join('')}
    </div>
  </div>`;
}

function renderBubbles(){
  const s = SUBJECTS[state.subjectIdx];
  const unit = s.units[state.unitIdx];
  return `<div class="wrap">
    <div class="topbar">
      <button class="crumb-btn" onclick="backTo('units')">← ${s.name}</button>
      <div>

      </div>
      <div></div>
    </div>
    <div class="bubble-grid">
      ${unit.topics.map((topic,t)=>{
        const high = topic.xp>=30;
        return `<div class="bubble" onclick="openTopic(${state.subjectIdx},${state.unitIdx},${t},false)">
          ${topic.title}
          <span class="tag ${high?'high':'quick'}">${high?'🔥 High Yield':'⚡ Quick'}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatTechnical(text){
  const blocks = text.split('\n\n');
  return blocks.map(block=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    return lines.map(line=>{
      const isFormula = /[=≤≥⟹⊕]/.test(line) || /^(O\(|T\(|Address|Sum|Carry|rear|h\(k\)|dist\[)/.test(line);
      return isFormula
        ? `<span class="formula-line">${escapeHtml(line)}</span>`
        : `<p>${escapeHtml(line)}</p>`;
    }).join('');
  }).join('');
}
function renderDrawer(){
  const {s,u,t} = activeTopicRef;
  const subj = SUBJECTS[s];
  const unit = subj.units[u];
  const topic = unit.topics[t];
  const key = tkey(s,u,t);
  const done = state.completed.has(key);
  const html = `
  <div class="overlay" id="drawerOverlay" onclick="if(event.target===this) closeDrawer()">
    <div class="drawer">
      <div class="drawer-head">
        <h2>${topic.title}</h2>
        <button class="close-x" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-meta">
        <span class="pill" style="color:${colorVar(subj.color)}">${subj.name}</span>
        <span class="pill">${unit.title}</span>
        <span class="pill xp">⭐ ${topic.xp} XP</span>
      </div>

      <div class="panel">
        <h4>⏱ 60-Second Intuition</h4>
        <p>${topic.intuition}</p>
      </div>

      <div class="panel">
        <h4>🧩 Technical Formulation & Key Details</h4>
        <div class="tech-content">${formatTechnical(topic.technical)}</div>
      </div>

      <div class="panel trap">
        <h4>⚠️ AKTU Exam Trap</h4>
        <p>${topic.trap}</p>
      </div>

      <div class="panel res">
        <h4>🎥 Curated Resources</h4>
        <div class="res-links">
          ${topic.resources.map(r=>`<a class="res-link" href="${r.url}" target="_blank" rel="noopener">
            <span>▶</span><span style="flex:1;">${r.name}</span><span class="rtype">Open ↗</span>
          </a>`).join('')}
        </div>
      </div>

      <div class="drawer-actions">
        ${done
          ? `<button class="btn btn-outline" disabled>✓ Completed</button>`
          : `<button class="btn btn-emerald" onclick="completeTopic()">Mark Complete +${topic.xp} XP</button>`}
        <button class="btn btn-outline" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

render();
